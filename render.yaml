services:
  - type: web
    name: zongzhi-assistant
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com/v1
      - key: DEEPSEEK_MODEL
        value: deepseek-flash
      - key: DEEPSEEK_API_KEY
        sync: false
