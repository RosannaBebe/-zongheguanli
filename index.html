<style>
:root{--ink:#10243a;--text:#263e58;--muted:#4d637b;--line:#c3d2e3;--blue:#174f9c;--blue-dark:#103b78;--soft:#e1ecf9;--paper:#fff;--warm:#b87521;--warm-soft:#f7ead6;--font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:var(--font);color:var(--ink);background:#eef3f9}button,textarea{font:inherit}button{cursor:pointer} [hidden]{display:none!important}.only-local,#loginStatus{display:none!important}
body{min-height:100vh;background:radial-gradient(ellipse at 84% 12%,#b9e0f1 0,transparent 48%),radial-gradient(ellipse at 14% 36%,#cbcef0 0,transparent 49%),radial-gradient(ellipse at 54% 100%,#f2e4d2 0,transparent 37%),#eef3f9}

.top-actions{display:flex;align-items:center;gap:10px}.top-actions span{font-size:12px;color:var(--muted)}.button{border:1px solid #b7c9dd;border-radius:10px;background:#fff;color:var(--text);padding:8px 12px;font-size:12px}.button:hover{background:#eaf0f7}.button.primary{background:var(--blue);border-color:var(--blue);color:#fff}.button.primary:hover{background:var(--blue-dark)}
.home{width:min(900px,100%);margin:0 auto;padding:54px 24px 42px}.hero{text-align:center}.avatar{display:block;width:100px;height:100px;margin:0 auto 18px;border-radius:50%;object-fit:cover;background:#e1edfc;box-shadow:0 10px 25px #32598c18}.hero h1{margin:0 0 26px;font-size:clamp(28px,5vw,46px);line-height:1.2;letter-spacing:-.04em}.home-form{display:flex;gap:12px;align-items:flex-end;padding:12px 13px 12px 20px;border:1px solid #9eb8d5;border-radius:17px;background:#fff;box-shadow:0 12px 34px #315a8e15}.home-form:focus-within{border-color:#3c73b3;box-shadow:0 0 0 3px #b7d0ee80,0 12px 34px #315a8e15}.home-form textarea{flex:1;min-width:0;min-height:48px;max-height:180px;resize:vertical;border:0;outline:0;padding:7px 0;background:transparent;color:var(--ink);line-height:1.6}.home-form textarea::placeholder{color:#4d647d}.send{width:44px;height:44px;border:0;border-radius:11px;background:var(--blue);color:#fff;font-size:20px}.send:disabled{opacity:.6}.send.is-loading:disabled{opacity:1}.send-arrow{display:inline}.send-dots{display:none;align-items:center;justify-content:center;gap:4px}.send.is-loading .send-arrow{display:none}.send.is-loading .send-dots{display:inline-flex}.send-dots i{width:5px;height:5px;border-radius:50%;background:#fff;animation:thinking-dot 1s infinite ease-in-out}.send-dots i:nth-child(2){animation-delay:.15s}.send-dots i:nth-child(3){animation-delay:.3s}@keyframes thinking-dot{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}@media(prefers-reduced-motion:reduce){.send-dots i{animation:none;opacity:.8}}.thinking{margin:12px 4px;color:var(--muted);font-size:13px}

ere}.message.user{align-self:flex-end;background:#dce9f9;border-color:#b8cce4;border-bottom-right-radius:5px}.message.assistant{border-bottom-left-radius:5px}.message.pending{color:#526981}.compose{padding:13px;border-top:1px solid #ccd9e7}.compose textarea{display:block;width:100%;min-height:76px;max-height:180px;resize:vertical;padding:10px 12px;border:1px solid #b7c9dd;border-radius:12px;outline:0;font-size:13px;line-height:1.6}.compose textarea:focus{border-color:#78a3df;box-shadow:0 0 0 3px #b7d0ee80}.compose-row{display:flex;align-items:center;justify-content:space-between;margin-top:9px;gap:10px}.compose-row small{color:#536981;font-size:11px}.result-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:20px 22px 15px;border-bottom:1px solid #ccd9e7;background:#fff}.result-head h2{margin:0;font-size:17px}.result-head p{margin:5px 0 0;color:#526981;font-size:12px}.state{font-size:11px;color:#52708e}.state:before{content:"";display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:50%;background:#55799f}.state.ready:before{background:#36a477}.result-body{flex:1;overflow:auto;padding:22px;background:linear-gradient(#fff,#f6f9fd)}.result-placeholder{height:100%;min-height:390px;display:grid;place-content:center;text-align:center;color:var(--muted)}.result-placeholder b{margin-bottom:8px;color:var(--text);font-size:17px}.result-content{font-size:14px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.result-content:empty{display:none}.result-attachment{margin-top:18px;padding:13px;border:1px solid var(--line);border-radius:12px;background:white}.result-attachment strong{font-size:12px}.result-attachment p{margin:5px 0 0;color:var(--text);font-size:13px;white-space:pre-wrap}
.overlay{position:fixed;inset:0;z-index:20;display:flex;justify-content:flex-end;background:#14263855;backdrop-filter:blur(3px)}.drawer{width:min(440px,100vw);height:100%;display:flex;flex-direction:column;padding:22px;background:#eef3f9;box-shadow:-15px 0 45px #14263820}.drawer-head{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:16px;border-bottom:1px solid var(--line)}.drawer-head h2{margin:0;font-size:19px}.drawer-head p{margin:5px 0 0;color:var(--muted);font-size:12px}.history-list{flex:1;overflow:auto;display:grid;align-content:start;gap:9px;padding:15px 0}.history-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:13px;border:1px solid var(--line);border-radius:13px;background:white}.history-open{min-width:0;border:0;background:transparent;text-align:left;color:var(--ink);cursor:pointer}.history-title{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:650}.history-meta{display:block;margin-top:5px;color:#526981;font-size:11px}.history-empty{padding:40px 10px;text-align:center;color:var(--muted);font-size:13px}.drawer-foot{padding-top:13px;border-top:1px solid var(--line)}
@media(max-width:900px){.shortcut-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:1100px){.layout{grid-template-columns:210px minmax(280px,360px) minmax(0,1fr);gap:12px;padding-inline:16px}}
@media(max-width:850px){.layout{grid-template-columns:1fr;padding:12px;min-height:0}.agent-history{min-height:0;max-height:none}.agent-history-list{display:flex;gap:6px;overflow:auto}.agent-history-item{flex:0 0 180px}.chat{min-height:470px;max-height:68vh}.result{min-height:420px;max-height:none}}

<style>
.home-dialog{width:min(100%,820px);max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:10px;margin:16px auto 0;padding:4px 2px;scrollbar-color:#9eb8d5 transparent}.home-dialog .message{max-width:min(82%,720px);font-size:14px;padding:12px 16px;border-radius:17px}.home-dialog .message.assistant{align-self:flex-start;background:#fff;border-color:#d4e0ed;box-shadow:0 4px 14px #24466d0b}.home-dialog .message.user{align-self:flex-end;background:#e2edfb;border-color:#c3d5ec;border-bottom-right-radius:5px}.home-dialog .message.pending{align-self:flex-start;color:#526981}.drawer-foot{display:flex;gap:8px;flex-wrap:wrap}

<header class="topbar" id="topbar"><a class="brand" href="/"><span class="brand-mark">综</span>综智助手</a><div class="top-actions"><span id="modelStatus">模型状态读取中</span><button class="button" id="historyOpen">历史对话</button></div></header>

<main class="home" id="homeView"><section class="hero"><img class="avatar" id="homeAvatar" alt="综智助手形象"><h1 id="greeting">您好，我是综智助手</h1><form class="home-form" id="homeForm"><textarea id="homeInput" rows="2" maxlength="4000" placeholder="工程设计院综合管理部竭诚为您服务" aria-label="请告知您需要办理的事项"></textarea><button class="send" id="homeSend" aria-label="发送需求"><span class="send-arrow" aria-hidden="true">↑</span><span class="send-dots" aria-hidden="true"><i></i><i></i><i></i></span></button></form></section><section class="home-dialog" id="homeDialog" role="log" aria-live="polite" aria-label="综智助手对话" hidden></section><nav class="shortcut-grid" aria-label="业务助手"><button class="shortcut" data-assistant="meeting"><span class="shortcut-icon">▦</span><span><strong>会务助手</strong><small>会议安排、名单和材料，我来替您统筹</small></span><span class="arrow">↗</span></button><button class="shortcut" data-assistant="information"><span class="shortcut-icon">▤</span><span><strong>政务信息助手</strong><small>为您搜集要情、核验来源并整理专报</small></span><span class="arrow">↗</span></button><button class="shortcut" data-assistant="official_document"><span class="shortcut-icon">▧</span><span><strong>公文助手</strong><small>为您起草、润色并校核公文</small></span><span class="arrow">↗</span></button><button class="shortcut" data-assistant="knowledge"><span class="shortcut-icon">▤</span><span><strong>综合知识库</strong><small>为您查阅制度、模板和历史案例</small></span><span class="arrow">↗</span></button></nav></main>
<section class="workspace" id="workspaceView" hidden><header class="workspace-head"><button class="back" id="backHome">← 返回首页</button><strong id="workspaceTitle">会务助手</strong><small id="workspaceSubtitle">我会为您周到安排</small></header><main class="layout"><aside class="agent-history"><header class="agent-history-head"><strong id="agentHistoryTitle">会议列表</strong><button class="button" id="newConversation">＋ 新建会议</button></header><div class="agent-history-list" id="agentHistoryList"></div><div class="agent-history-empty" id="agentHistoryEmpty">还没有会议记录。新建后，每次会议会作为独立记录保存在这里。</div></aside><aside class="chat"><div class="chat-head"><img class="chat-avatar" id="chatAvatar" alt=""><span><strong id="agentName">小会</strong><small id="agentTagline">您好，会议安排我来替您细细统筹。</small></span></div><div class="messages" id="messages" role="log" aria-live="polite"></div><form class="compose" id="chatForm"><textarea id="chatInput" rows="2" maxlength="4000" placeholder="请补充背景、具体要求或修改意见…" aria-label="请补充您的需求"></textarea><div class="compose-row"><small>Enter 发送 · Shift + Enter 换行</small><button class="button primary" id="chatSend">发送</button></div></form></aside><section class="result"><header class="result-head"><div><h2>工作成果</h2><p id="resultDescription">对话中的工作成果会显示在这里</p></div><span class="state" id="resultState">等待开始</span></header><div class="result-body"><div class="result-placeholder" id="resultPlaceholder"><div><b>已为您准备就绪</b><div>请说明您的需求，工作成果将在此处整理呈现</div></div></div><div class="result-content" id="resultContent"></div><div class="result-attachment" id="resultRequest" hidden><strong>当前办理事项</strong><p id="resultRequestText"></p></div></div></section></main></section>

function startSession(intent,initial='',restore=null,options={}){const cfg=assistants[intent];if(!cfg)return;active=restore||{id:(crypto.randomUUID?.()||Date.now()+'-'+Math.random().toString(36).slice(2)),assistant:intent,title:'新对话',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),messages:[],meetingName:'',meetingFacts:{}};active.assistant=intent;active.meetingFacts=active.meetingFacts||{};let importedHandoff='';try{importedHandoff=sessionStorage.getItem('zongzhi.current-home-handoff')||'';if(importedHandoff)sessionStorage.removeItem('zongzhi.current-home-handoff')}catch(_){}active.homeHandoff=options.homeHandoff||active.homeHandoff||importedHandoff;$('messages').replaceChildren();$('homeView').hidden=true;$('workspaceView').hidden=false;$('topbar').hidden=true;$('workspaceTitle').textContent=cfg.name;$('agentName').textContent=cfg.person;$('chatAvatar').src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(cfg.portrait);$('chatAvatar').alt=cfg.person+'的形象';$('agentTagline').textContent=cfg.tagline;$('workspaceSubtitle').textContent=intent==='meeting'&&active.meetingName?'当前会议 · '+active.meetingName:cfg.tagline;$('resultDescription').textContent=cfg.description+' · 工作过程与成果展示';$('resultState').textContent='等待开始';$('resultState').classList.remove('ready');$('resultContent').textContent='';$('resultPlaceholder').hidden=false;renderAgentHistory();

function simpleIntent(text){if(/会务助手|政务信息助手|公文助手|综合知识库/u.test(text)){if(/政务信息助手/u.test(text))return'information';if(/公文助手/u.test(text))return'official_document';if(/综合知识库/u.test(text))return'knowledge';return'meeting'}if(/(之前|上次|刚才|原来|那场|这场|继续|接着|讨论过|已经聊过).{0,12}(会议|会务|参会|人数|材料)|(会议|会务).{0,10}(改成|调整|更新|继续|接着|之前|上次)/u.test(text))return'meeting';if(/(查询|查找|查阅|搜一下|历史|以前|制度|模板|案例)/u.test(text)&&/(会议制度|会务制度|会议模板|会议案例|公文|信息|资料|要情|制度|模板|案例)/u.test(text))return'knowledge';if(/知识库/u.test(text))return'knowledge';if(/办会|办个会|开会|会议|会务|参会|会议室|会场/u.test(text))return'meeting';if(/要情|专报|新闻|信息稿|搜集.{0,4}信息/u.test(text))return'information';if(/公文|通知|请示|起草|润色|校对/u.test(text))return'official_document';return''}

$('chatForm').addEventListener('submit',e=>{e.preventDefault();const text=$('chatInput').value.trim();if(!text||busy)return;$('chatInput').value='';sendToAgent(text)});
$('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('chatForm').requestSubmit()}});
function renderHistory(){const list=$('historyList');list.replaceChildren();const items=readHistory().sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));$('historyEmpty').hidden=!!items.length;$('historyClear').disabled=!items.length;for(const item of items){const row=document.createElement('article');row.className='history-row';const open=document.createElement('button');open.className='history-open';open.type='button';const title=document.createElement('span');title.className='history-title';title.textContent=item.title||'新对话';const meta=document.createElement('span');meta.className='history-meta';meta.textContent=(item.assistant==='home'?'首页综合助手':(assistants[item.assistant]?.name||'综智助手'))+' · '+new Intl.DateTimeFormat('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(item.updatedAt));open.append(title,meta);open.onclick=()=>{if(item.assistant==='home'){restoreHomeConversation(item);return}saveHistory();$('historyOverlay').hidden=true;startSession(item.assistant,'',item)};const del=document.createElement('button');del.className='button';del.type='button';del.textContent='删除';del.onclick=()=>{if(active?.id===item.id)active=null;localStorage.setItem(HISTORY_KEY,JSON.stringify(readHistory().filter(x=>x.id!==item.id)));renderHistory()};row.append(open,del);list.append(row)}}
$('historyOpen').onclick=()=>{renderHistory();$('historyOverlay').hidden=false};$('historyClose').onclick=()=>$('historyOverlay').hidden=true;$('historyOverlay').onclick=e=>{if(e.target===$('historyOverlay'))$('historyOverlay').hidden=true};$('historyClear').onclick=()=>{active=null;homeConversation=null;localStorage.removeItem(HISTORY_KEY);renderHistory()};$('memoryClear').onclick=()=>{localStorage.removeItem(SHARED_MEMORY_KEY);$('memoryClear').textContent='共享记忆已清除';setTimeout(()=>$('memoryClear').textContent='清除共享记忆',1400)};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('historyOverlay').hidden=true});
window.addEventListener('popstate',()=>{if(location.hash.startsWith('#workbench/')){const key=location.hash.split('/')[1];startSession(assistants[key]?key:'meeting')}else{$('workspaceView').hidden=true;$('homeView').hidden=false;$('topbar').hidden=false;active=null;homeConversation=null;$('homeDialog').replaceChildren();$('homeDialog').hidden=true;$('messages').replaceChildren()}});
(async()=>{try{const s=await request('/api/ai/status');$('modelStatus').textContent=s.configured?'模型已连接 · '+s.model:'模型未配置'}catch(_){$('modelStatus').textContent='模型服务未连接'}if(location.hash.startsWith('#workbench/')){const key=location.hash.split('/')[1];if(assistants[key])startSession(key)}})();
</script>
</body>
</html>
