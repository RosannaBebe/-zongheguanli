<style>
:root{--ink:#10243a;--text:#263e58;--muted:#4d637b;--line:#c3d2e3;--blue:#174f9c;--blue-dark:#103b78;--soft:#e1ecf9;--paper:#fff;--warm:#b87521;--warm-soft:#f7ead6;--font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:var(--font);color:var(--ink);background:#eef3f9}button,textarea{font:inherit}button{cursor:pointer} [hidden]{display:none!important}.only-local,#loginStatus{display:none!important}
body{min-height:100vh;background:radial-gradient(ellipse at 84% 12%,#b9e0f1 0,transparent 48%),radial-gradient(ellipse at 14% 36%,#cbcef0 0,transparent 49%),radial-gradient(ellipse at 54% 100%,#f2e4d2 0,transparent 37%),#eef3f9}
.topbar{height:72px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:#f7f9fd;border-bottom:1px solid #c4d2e1}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none;font-size:16px;font-weight:700}.brand-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:var(--blue);color:white;font-size:18px;box-shadow:inset 0 -3px 0 #d49a42}
.top-actions{display:flex;align-items:center;gap:10px}.top-actions span{font-size:12px;color:var(--muted)}.button{border:1px solid #b7c9dd;border-radius:10px;background:#fff;color:var(--text);padding:8px 12px;font-size:12px}.button:hover{background:#eaf0f7}.button.primary{background:var(--blue);border-color:var(--blue);color:#fff}.button.primary:hover{background:var(--blue-dark)}
.home{width:min(900px,100%);margin:0 auto;padding:54px 24px 42px}.hero{text-align:center}.avatar{display:block;width:100px;height:100px;margin:0 auto 18px;border-radius:50%;object-fit:cover;background:#e1edfc;box-shadow:0 10px 25px #32598c18}.hero h1{margin:0 0 26px;font-size:clamp(28px,5vw,46px);line-height:1.2;letter-spacing:-.04em}.home-form{display:flex;gap:12px;align-items:flex-end;padding:12px 13px 12px 20px;border:1px solid #9eb8d5;border-radius:17px;background:#fff;box-shadow:0 12px 34px #315a8e15}.home-form:focus-within{border-color:#3c73b3;box-shadow:0 0 0 3px #b7d0ee80,0 12px 34px #315a8e15}.home-form textarea{flex:1;min-width:0;min-height:48px;max-height:180px;resize:vertical;border:0;outline:0;padding:7px 0;background:transparent;color:var(--ink);line-height:1.6}.home-form textarea::placeholder{color:#4d647d}.send{width:44px;height:44px;border:0;border-radius:11px;background:var(--blue);color:#fff;font-size:20px}.send:disabled{opacity:.6}.send.is-loading:disabled{opacity:1}.send-arrow{display:inline}.send-dots{display:none;align-items:center;justify-content:center;gap:4px}.send.is-loading .send-arrow{display:none}.send.is-loading .send-dots{display:inline-flex}.send-dots i{width:5px;height:5px;border-radius:50%;background:#fff;animation:thinking-dot 1s infinite ease-in-out}.send-dots i:nth-child(2){animation-delay:.15s}.send-dots i:nth-child(3){animation-delay:.3s}@keyframes thinking-dot{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}@media(prefers-reduced-motion:reduce){.send-dots i{animation:none;opacity:.8}}.thinking{margin:12px 4px;color:var(--muted);font-size:13px}
.shortcut-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:24px}.shortcut{display:flex;align-items:center;gap:9px;min-height:76px;padding:10px 11px;text-align:left;border:1px solid var(--line);border-radius:14px;background:#ffffffdf;color:var(--ink);transition:.15s;text-decoration:none}.shortcut:hover{background:#fff;border-color:#9bbce4;transform:translateY(-1px)}.shortcut-icon{display:grid;place-items:center;width:32px;height:32px;flex:none;border-radius:11px;background:#dce8f6;color:#174f9c;font-size:18px}.shortcut strong{display:block;font-size:13px}.shortcut small{display:block;margin-top:4px;color:var(--muted);font-size:11px;line-height:1.4}.arrow{margin-left:auto;color:#587896}
.workspace{min-height:calc(100vh - 72px)}.workspace-head{display:flex;align-items:center;gap:14px;padding:16px clamp(16px,3vw,36px);background:#ffffffed;border-bottom:1px solid var(--line)}.back{border:0;background:transparent;color:#47627d;font-weight:600;padding:8px}.workspace-head strong{font-size:17px}.workspace-head small{margin-left:auto;color:var(--muted);font-size:12px}
.layout{display:grid;grid-template-columns:230px minmax(300px,390px) minmax(0,1fr);gap:16px;max-width:1580px;min-height:calc(100vh - 140px);margin:0 auto;padding:18px clamp(16px,3vw,36px) 30px}.agent-history,.chat,.result{min-width:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;background:#ffffffed;box-shadow:0 10px 30px #315a8e0d;overflow:hidden}.agent-history{min-height:620px;max-height:calc(100vh - 160px)}.agent-history-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:15px 13px;border-bottom:1px solid #ccd9e7}.agent-history-head strong{font-size:13px}.agent-history-list{flex:1;overflow:auto;padding:10px;display:grid;align-content:start;gap:8px}.agent-history-item{width:100%;padding:10px;text-align:left;border:1px solid transparent;border-radius:11px;background:transparent;color:var(--ink)}.agent-history-item:hover,.agent-history-item.active{border-color:#b9cce2;background:#e1ebf7}.agent-history-item strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.agent-history-item small{display:block;margin-top:5px;color:var(--muted);font-size:10px}.agent-history-empty{padding:18px 11px;color:var(--muted);font-size:11px;line-height:1.6}.chat,.result{min-height:620px;max-height:calc(100vh - 160px)}.chat-head{display:flex;align-items:center;gap:11px;padding:16px 18px;border-bottom:1px solid #ccd9e7}.chat-avatar{display:block;width:62px;height:62px;flex:none;object-fit:cover;border-radius:18px;background:#e5effb;box-shadow:0 7px 18px #235fbf26;border:1px solid #c7d7ea}.chat-head strong{font-size:14px}.chat-head small{display:block;margin-top:3px;color:#526981;font-size:11px}.messages{flex:1;display:flex;flex-direction:column;gap:12px;padding:18px;overflow:auto}.message{max-width:95%;width:fit-content;padding:11px 13px;border:1px solid #ccd9e7;border-radius:15px;background:#eef3f9;color:#293e54;font-size:13px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}.message.user{align-self:flex-end;background:#dce9f9;border-color:#b8cce4;border-bottom-right-radius:5px}.message.assistant{border-bottom-left-radius:5px}.message.pending{color:#526981}.compose{padding:13px;border-top:1px solid #ccd9e7}.compose textarea{display:block;width:100%;min-height:76px;max-height:180px;resize:vertical;padding:10px 12px;border:1px solid #b7c9dd;border-radius:12px;outline:0;font-size:13px;line-height:1.6}.compose textarea:focus{border-color:#78a3df;box-shadow:0 0 0 3px #b7d0ee80}.compose-row{display:flex;align-items:center;justify-content:space-between;margin-top:9px;gap:10px}.compose-row small{color:#536981;font-size:11px}.result-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:20px 22px 15px;border-bottom:1px solid #ccd9e7;background:#fff}.result-head h2{margin:0;font-size:17px}.result-head p{margin:5px 0 0;color:#526981;font-size:12px}.state{font-size:11px;color:#52708e}.state:before{content:"";display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:50%;background:#55799f}.state.ready:before{background:#36a477}.result-body{flex:1;overflow:auto;padding:22px;background:linear-gradient(#fff,#f6f9fd)}.result-placeholder{height:100%;min-height:390px;display:grid;place-content:center;text-align:center;color:var(--muted)}.result-placeholder b{margin-bottom:8px;color:var(--text);font-size:17px}.result-content{font-size:14px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.result-content:empty{display:none}.result-attachment{margin-top:18px;padding:13px;border:1px solid var(--line);border-radius:12px;background:white}.result-attachment strong{font-size:12px}.result-attachment p{margin:5px 0 0;color:var(--text);font-size:13px;white-space:pre-wrap}
.overlay{position:fixed;inset:0;z-index:20;display:flex;justify-content:flex-end;background:#14263855;backdrop-filter:blur(3px)}.drawer{width:min(440px,100vw);height:100%;display:flex;flex-direction:column;padding:22px;background:#eef3f9;box-shadow:-15px 0 45px #14263820}.drawer-head{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:16px;border-bottom:1px solid var(--line)}.drawer-head h2{margin:0;font-size:19px}.drawer-head p{margin:5px 0 0;color:var(--muted);font-size:12px}.history-list{flex:1;overflow:auto;display:grid;align-content:start;gap:9px;padding:15px 0}.history-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:13px;border:1px solid var(--line);border-radius:13px;background:white}.history-open{min-width:0;border:0;background:transparent;text-align:left;color:var(--ink);cursor:pointer}.history-title{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:650}.history-meta{display:block;margin-top:5px;color:#526981;font-size:11px}.history-empty{padding:40px 10px;text-align:center;color:var(--muted);font-size:13px}.drawer-foot{padding-top:13px;border-top:1px solid var(--line)}
@media(max-width:900px){.shortcut-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:1100px){.layout{grid-template-columns:210px minmax(280px,360px) minmax(0,1fr);gap:12px;padding-inline:16px}}
@media(max-width:850px){.layout{grid-template-columns:1fr;padding:12px;min-height:0}.agent-history{min-height:0;max-height:none}.agent-history-list{display:flex;gap:6px;overflow:auto}.agent-history-item{flex:0 0 180px}.chat{min-height:470px;max-height:68vh}.result{min-height:420px;max-height:none}}
@media(max-width:760px){.topbar{height:60px;padding:0 15px}.top-actions span{display:none}.home{padding:38px 15px}.shortcut-grid{gap:8px}.shortcut{padding:10px;gap:8px}.shortcut strong{font-size:13px}.shortcut small{font-size:11px}.workspace-head{padding:12px 14px}}

.meeting-workflow{display:grid;gap:18px;color:var(--ink)}.workflow-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.workflow-step{padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--muted);font-size:12px}.workflow-step.active{border-color:#477fbe;background:#e7f0fb;color:#123f76;font-weight:700}.workflow-step.done{border-color:#8db9a6;background:#edf7f1;color:#27634b}.workflow-card{padding:17px;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 5px 16px #183c6209}.workflow-card h3{margin:0 0 6px;font-size:16px}.workflow-hint{margin:0 0 14px;color:var(--muted);font-size:12px;line-height:1.65}.workflow-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.workflow-field{display:grid;gap:5px}.workflow-field.full{grid-column:1/-1}.workflow-field label{font-size:11px;font-weight:650;color:#435a72}.workflow-field input,.workflow-field select,.workflow-field textarea,.material-editor{width:100%;border:1px solid #b7c9dd;border-radius:9px;padding:9px 10px;background:#fff;color:var(--ink);font:inherit;font-size:12px}.attendee-row{display:grid;grid-template-columns:110px 1fr 1fr 1fr auto;gap:8px;align-items:end;margin:12px 0}.attendee-list,.visitor-matches{display:grid;gap:7px;margin-top:10px}.attendee-item,.visitor-match{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid #d4e0ed;border-radius:9px;background:#f8fbff;font-size:12px}.visitor-match{width:100%;text-align:left;color:var(--ink);cursor:pointer}.visitor-match:hover{background:#eaf2fc}.workflow-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.workflow-btn,.material-tab{border:1px solid #a8bfd8;border-radius:9px;padding:9px 13px;background:#fff;color:#24496e;font:inherit;font-size:12px;cursor:pointer}.workflow-btn.primary{background:#174f9c;color:#fff;border-color:#174f9c}.workflow-btn:disabled{opacity:.5;cursor:not-allowed}.material-tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);padding-bottom:9px}.material-tab.active{background:#174f9c;color:#fff;border-color:#174f9c}.material-content{min-height:230px;margin-top:13px;padding:15px;border:1px solid #d5e1ef;border-radius:11px;background:#f9fbfe;white-space:pre-wrap;overflow:auto;font:13px/1.75 ui-monospace,SFMono-Regular,Menlo,monospace}.material-editor{min-height:270px;margin-top:13px;resize:vertical;font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace}.visitor-directory,.material-library{margin-top:14px;border-top:1px solid #e0e8f1;padding-top:12px}.visitor-directory summary,.material-library summary{cursor:pointer;color:#365775;font-size:12px;font-weight:700}.visitor-directory-list,.library-list{display:grid;gap:6px;margin-top:9px}.visitor-directory-item,.library-item{color:var(--muted);font-size:11px;line-height:1.5}.export-choice{display:flex;gap:9px;flex-wrap:wrap}.workflow-note{font-size:12px;color:#41624f;background:#edf7f1;border-radius:9px;padding:10px 12px}.
</style>
<style>
.home-dialog{width:min(100%,820px);max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:10px;margin:16px auto 0;padding:4px 2px;scrollbar-color:#9eb8d5 transparent}.home-dialog .message{max-width:min(82%,720px);font-size:14px;padding:12px 16px;border-radius:17px}.home-dialog .message.assistant{align-self:flex-start;background:#fff;border-color:#d4e0ed;box-shadow:0 4px 14px #24466d0b}.home-dialog .message.user{align-self:flex-end;background:#e2edfb;border-color:#c3d5ec;border-bottom-right-radius:5px}.home-dialog .message.pending{align-self:flex-start;color:#526981}.drawer-foot{display:flex;gap:8px;flex-wrap:wrap}

<body>
<header class="topbar" id="topbar"><a class="brand" href="/"><span class="brand-mark">综</span>综智助手</a><div class="top-actions"><span id="modelStatus">模型状态读取中</span><button class="button" id="historyOpen">历史对话</button></div></header>
<section class="overlay" id="historyOverlay" hidden><div class="drawer" role="dialog" aria-modal="true" aria-labelledby="historyTitle"><header class="drawer-head"><div><h2 id="historyTitle">历史对话</h2><p>记录与共享记忆保存在当前浏览器</p></div><button class="button" id="historyClose" aria-label="关闭">关闭</button></header><div class="history-list" id="historyList"></div><div class="history-empty" id="historyEmpty" hidden>还没有历史对话</div><footer class="drawer-foot"><button class="button" id="historyClear">清空历史</button><button class="button" id="memoryClear">清除共享记忆</button></footer></div></section>
<main class="home" id="homeView"><section class="hero"><img class="avatar" id="homeAvatar" alt="综智助手形象"><h1 id="greeting">您好，我是综智助手</h1><form class="home-form" id="homeForm"><textarea id="homeInput" rows="2" maxlength="4000" placeholder="工程设计院综合管理部竭诚为您服务" aria-label="请告知您需要办理的事项"></textarea><button class="send" id="homeSend" aria-label="发送需求"><span class="send-arrow" aria-hidden="true">↑</span><span class="send-dots" aria-hidden="true"><i></i><i></i><i></i></span></button></form></section><section class="home-dialog" id="homeDialog" role="log" aria-live="polite" aria-label="综智助手对话" hidden></section><nav class="shortcut-grid" aria-label="业务助手"><button class="shortcut" data-assistant="meeting"><span class="shortcut-icon">▦</span><span><strong>会务助手</strong><small>会议安排、名单和材料，我来替您统筹</small></span><span class="arrow">↗</span></button><button class="shortcut" data-assistant="information"><span class="shortcut-icon">▤</span><span><strong>政务信息助手</strong><small>为您搜集要情、核验来源并整理专报</small></span><span class="arrow">↗</span></button><button class="shortcut" data-assistant="official_document"><span class="shortcut-icon">▧</span><span><strong>公文助手</strong><small>为您起草、润色并校核公文</small></span><span class="arrow">↗</span></button><button class="shortcut" data-assistant="knowledge"><span class="shortcut-icon">▤</span><span><strong>综合知识库</strong><small>为您查阅制度、模板和历史案例</small></span><span class="arrow">↗</span></button></nav></main>
<section class="workspace" id="workspaceView" hidden><header class="workspace-head"><button class="back" id="backHome">← 返回首页</button><strong id="workspaceTitle">会务助手</strong><small id="workspaceSubtitle">我会为您周到安排</small></header><main class="layout"><aside class="agent-history"><header class="agent-history-head"><strong id="agentHistoryTitle">会议列表</strong><button class="button" id="newConversation">＋ 新建会议</button></header><div class="agent-history-list" id="agentHistoryList"></div><div class="agent-history-empty" id="agentHistoryEmpty">还没有会议记录。新建后，每次会议会作为独立记录保存在这里。</div></aside><aside class="chat"><div class="chat-head"><img class="chat-avatar" id="chatAvatar" alt=""><span><strong id="agentName">小会</strong><small id="agentTagline">您好，会议安排我来替您细细统筹。</small></span></div><div class="messages" id="messages" role="log" aria-live="polite"></div><form class="compose" id="chatForm"><textarea id="chatInput" rows="2" maxlength="4000" placeholder="请补充背景、具体要求或修改意见…" aria-label="请补充您的需求"></textarea><div class="compose-row"><small>Enter 发送 · Shift + Enter 换行</small><button class="button primary" id="chatSend">发送</button></div></form></aside><section class="result"><header class="result-head"><div><h2>工作成果</h2><p id="resultDescription">对话中的工作成果会显示在这里</p></div><span class="state" id="resultState">等待开始</span></header><div class="result-body"><div class="result-placeholder" id="resultPlaceholder"><div><b>已为您准备就绪</b><div>请说明您的需求，工作成果将在此处整理呈现</div></div></div><div class="result-content" id="resultContent"></div><div class="meeting-workflow" id="meetingWorkflow" hidden></div><div class="result-attachment" id="resultRequest" hidden><strong>当前办理事项</strong><p id="resultRequestText"></p></div></div></section></main></section>
<script>
const $=id=>document.getElementById(id);const HISTORY_KEY='zongzhi.conversations.v1',SHARED_MEMORY_KEY='zongzhi.shared-memory.v1';
function makePortrait({skin,hair,style,glasses=false,face='oval',brow='#39434b',lip='#a86b63',uniform='#929eaa',age='adult'}){
 const faceRx=face==='round'?24:face==='long'?20:22;
 const hairShape=style==='bob'?'<path d="M34 55Q25 42 31 28Q37 13 60 13Q84 13 90 31Q94 43 86 57L84 83Q78 77 77 66L75 43Q59 51 39 44L37 68 34 82Z" fill="url(#hair)"/><path d="M34 58Q28 68 34 80M86 55Q92 66 86 79" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="2"/>':style==='pony'?'<path d="M34 51Q29 29 43 18Q55 9 71 16Q91 24 87 51L83 62Q75 47 76 36Q58 48 39 42Z" fill="url(#hair)"/><path d="M84 43Q101 48 96 70Q93 80 85 84L82 73Q90 61 82 54Z" fill="url(#hair)"/><path d="M36 49Q29 63 34 77" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="2"/>':style==='silver'?'<path d="M34 52Q30 30 44 18Q56 9 72 17Q89 25 86 52L82 61Q78 48 77 38Q65 33 59 39Q50 46 38 44Z" fill="url(#hair)"/><path d="M36 32Q45 18 57 18M66 18Q79 20 83 32" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2"/>':'<path d="M34 54Q29 30 45 18Q59 8 75 19Q89 29 85 54L82 60Q77 46 76 36Q58 44 39 42Z" fill="url(#hair)"/><path d="M40 29Q52 17 65 20" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="2"/>';

$('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('chatForm').requestSubmit()}});
function renderHistory(){const list=$('historyList');list.replaceChildren();const items=readHistory().sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));$('historyEmpty').hidden=!!items.length;$('historyClear').disabled=!items.length;for(const item of items){const row=document.createElement('article');row.className='history-row';const open=document.createElement('button');open.className='history-open';open.type='button';const title=document.createElement('span');title.className='history-title';title.textContent=item.title||'新对话';const meta=document.createElement('span');meta.className='history-meta';meta.textContent=(item.assistant==='home'?'首页综合助手':(assistants[item.assistant]?.name||'综智助手'))+' · '+new Intl.DateTimeFormat('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(item.updatedAt));open.append(title,meta);open.onclick=()=>{if(item.assistant==='home'){restoreHomeConversation(item);return}saveHistory();$('historyOverlay').hidden=true;startSession(item.assistant,'',item)};const del=document.createElement('button');del.className='button';del.type='button';del.textContent='删除';del.onclick=()=>{if(active?.id===item.id)active=null;localStorage.setItem(HISTORY_KEY,JSON.stringify(readHistory().filter(x=>x.id!==item.id)));renderHistory()};row.append(open,del);list.append(row)}}
$('historyOpen').onclick=()=>{renderHistory();$('historyOverlay').hidden=false};$('historyClose').onclick=()=>$('historyOverlay').hidden=true;$('historyOverlay').onclick=e=>{if(e.target===$('historyOverlay'))$('historyOverlay').hidden=true};$('historyClear').onclick=()=>{active=null;homeConversation=null;localStorage.removeItem(HISTORY_KEY);renderHistory()};$('memoryClear').onclick=()=>{localStorage.removeItem(SHARED_MEMORY_KEY);$('memoryClear').textContent='共享记忆已清除';setTimeout(()=>$('memoryClear').textContent='清除共享记忆',1400)};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('historyOverlay').hidden=true});
window.addEventListener('popstate',()=>{if(location.hash.startsWith('#workbench/')){const key=location.hash.split('/')[1];startSession(assistants[key]?key:'meeting')}else{$('workspaceView').hidden=true;$('homeView').hidden=false;$('topbar').hidden=false;active=null;homeConversation=null;$('homeDialog').replaceChildren();$('homeDialog').hidden=true;$('messages').replaceChildren()}});
(async()=>{try{const s=await request('/api/ai/status');$('modelStatus').textContent=s.configured?'模型已连接 · '+s.model:'模型未配置'}catch(_){$('modelStatus').textContent='模型服务未连接'}if(location.hash.startsWith('#workbench/')){const key=location.hash.split('/')[1];if(assistants[key])startSession(key)}})();
</script>
</body>
</html>
