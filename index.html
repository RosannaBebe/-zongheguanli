<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>综智助手</title>
<style>
:root{--ink:#142638;--text:#344c64;--muted:#647b92;--line:#e1eaf5;--blue:#235fbf;--blue-dark:#194f9f;--soft:#edf4fd;--paper:#fff;--font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:var(--font);color:var(--ink);background:#f8fbff}button,textarea{font:inherit}button{cursor:pointer} [hidden]{display:none!important}
body{min-height:100vh;background:radial-gradient(ellipse at 83% 14%,#d4f0ff 0,transparent 48%),radial-gradient(ellipse at 15% 35%,#e6e4ff 0,transparent 50%),#f8fbff}
.topbar{height:72px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:#fcfdff;border-bottom:1px solid #e8eef6}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none;font-size:16px;font-weight:700}.brand-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:var(--blue);color:white;font-size:18px}
.top-actions{display:flex;align-items:center;gap:10px}.top-actions span{font-size:12px;color:var(--muted)}.button{border:1px solid #d7e3f1;border-radius:10px;background:#fff;color:var(--text);padding:8px 12px;font-size:12px}.button:hover{background:#f3f7fd}.button.primary{background:var(--blue);border-color:var(--blue);color:#fff}.button.primary:hover{background:var(--blue-dark)}
.home{width:min(900px,100%);margin:0 auto;padding:54px 24px 42px}.hero{text-align:center}.avatar{display:grid;place-items:center;width:100px;height:100px;margin:0 auto 18px;border-radius:50%;background:#e1edfc;color:var(--blue);font-size:38px;box-shadow:0 10px 25px #32598c18}.hero h1{margin:0 0 26px;font-size:clamp(28px,5vw,46px);line-height:1.2;letter-spacing:-.04em}.home-form{display:flex;gap:12px;align-items:flex-end;padding:12px 13px 12px 20px;border:1px solid #bfd3eb;border-radius:17px;background:#fff;box-shadow:0 12px 34px #315a8e15}.home-form:focus-within{border-color:#6496d8;box-shadow:0 0 0 3px #c5ddf980,0 12px 34px #315a8e15}.home-form textarea{flex:1;min-width:0;min-height:48px;max-height:180px;resize:vertical;border:0;outline:0;padding:7px 0;background:transparent;color:var(--ink);line-height:1.6}.home-form textarea::placeholder{color:#607890}.send{width:44px;height:44px;border:0;border-radius:11px;background:var(--blue);color:#fff;font-size:20px}.send:disabled{opacity:.6}.thinking{margin:12px 4px;color:var(--muted);font-size:13px}
.shortcut-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:24px}.shortcut{display:flex;align-items:center;gap:9px;min-height:76px;padding:10px 11px;text-align:left;border:1px solid var(--line);border-radius:14px;background:#ffffffdf;color:var(--ink);transition:.15s;text-decoration:none}.shortcut:hover{background:#fff;border-color:#9bbce4;transform:translateY(-1px)}.shortcut-icon{display:grid;place-items:center;width:32px;height:32px;flex:none;border-radius:11px;background:var(--soft);color:var(--blue);font-size:18px}.shortcut strong{display:block;font-size:13px}.shortcut small{display:block;margin-top:4px;color:var(--muted);font-size:11px;line-height:1.4}.arrow{margin-left:auto;color:#587896}
.workspace{min-height:calc(100vh - 72px)}.workspace-head{display:flex;align-items:center;gap:14px;padding:16px clamp(16px,3vw,36px);background:#ffffffed;border-bottom:1px solid var(--line)}.back{border:0;background:transparent;color:#47627d;font-weight:600;padding:8px}.workspace-head strong{font-size:17px}.workspace-head small{margin-left:auto;color:var(--muted);font-size:12px}
.layout{display:grid;grid-template-columns:minmax(300px,390px) minmax(0,1fr);gap:18px;max-width:1580px;min-height:calc(100vh - 140px);margin:0 auto;padding:18px clamp(16px,3vw,36px) 30px}.chat,.result{min-width:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;background:#ffffffed;box-shadow:0 10px 30px #315a8e0d;overflow:hidden}.chat{min-height:620px;max-height:calc(100vh - 160px)}.chat-head{display:flex;align-items:center;gap:11px;padding:16px 18px;border-bottom:1px solid #eaf0f8}.chat-avatar{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,#2a69c9,#5b8dde);color:white;font-weight:700}.chat-head strong{font-size:14px}.chat-head small{display:block;margin-top:3px;color:#73869a;font-size:11px}.messages{flex:1;display:flex;flex-direction:column;gap:12px;padding:18px;overflow:auto}.message{max-width:95%;width:fit-content;padding:11px 13px;border:1px solid #e5edf7;border-radius:15px;background:#f8fbff;color:#293e54;font-size:13px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}.message.user{align-self:flex-end;background:#eaf2ff;border-color:#eaf2ff;border-bottom-right-radius:5px}.message.assistant{border-bottom-left-radius:5px}.message.pending{color:#71859a}.compose{padding:13px;border-top:1px solid #eaf0f8}.compose textarea{display:block;width:100%;min-height:76px;max-height:180px;resize:vertical;padding:10px 12px;border:1px solid #d7e3f1;border-radius:12px;outline:0;font-size:13px;line-height:1.6}.compose textarea:focus{border-color:#78a3df;box-shadow:0 0 0 3px #c5ddf980}.compose-row{display:flex;align-items:center;justify-content:space-between;margin-top:9px;gap:10px}.compose-row small{color:#75899e;font-size:11px}.result-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:20px 22px 15px;border-bottom:1px solid #eaf0f8;background:#fff}.result-head h2{margin:0;font-size:17px}.result-head p{margin:5px 0 0;color:#71859a;font-size:12px}.state{font-size:11px;color:#52708e}.state:before{content:"";display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:50%;background:#8aa4c4}.state.ready:before{background:#36a477}.result-body{flex:1;overflow:auto;padding:22px;background:linear-gradient(#fff,#f6f9fd)}.result-placeholder{height:100%;min-height:390px;display:grid;place-content:center;text-align:center;color:var(--muted)}.result-placeholder b{margin-bottom:8px;color:var(--text);font-size:17px}.result-content{font-size:14px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.result-content:empty{display:none}.result-attachment{margin-top:18px;padding:13px;border:1px solid var(--line);border-radius:12px;background:white}.result-attachment strong{font-size:12px}.result-attachment p{margin:5px 0 0;color:var(--text);font-size:13px;white-space:pre-wrap}
.overlay{position:fixed;inset:0;z-index:20;display:flex;justify-content:flex-end;background:#14263855;backdrop-filter:blur(3px)}.drawer{width:min(440px,100vw);height:100%;display:flex;flex-direction:column;padding:22px;background:#f8fbff;box-shadow:-15px 0 45px #14263820}.drawer-head{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:16px;border-bottom:1px solid var(--line)}.drawer-head h2{margin:0;font-size:19px}.drawer-head p{margin:5px 0 0;color:var(--muted);font-size:12px}.history-list{flex:1;overflow:auto;display:grid;align-content:start;gap:9px;padding:15px 0}.history-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:13px;border:1px solid var(--line);border-radius:13px;background:white}.history-open{min-width:0;border:0;background:transparent;text-align:left;color:var(--ink);cursor:pointer}.history-title{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:650}.history-meta{display:block;margin-top:5px;color:#7a8da1;font-size:11px}.history-empty{padding:40px 10px;text-align:center;color:var(--muted);font-size:13px}.drawer-foot{padding-top:13px;border-top:1px solid var(--line)}
@media(max-width:900px){.shortcut-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.topbar{height:60px;padding:0 15px}.top-actions span{display:none}.home{padding:38px 15px}.shortcut-grid{gap:8px}.shortcut{padding:10px;gap:8px}.shortcut strong{font-size:13px}.shortcut small{font-size:11px}.layout{grid-template-columns:1fr;padding:12px;min-height:0}.chat{min-height:470px;max-height:68vh}.result{min-height:420px}.workspace-head{padding:12px 14px}}
</style>
</head>
<body>
<header class="topbar"><a class="brand" href="/"><span class="brand-mark">综</span>综智助手</a><div class="top-actions"><span id="modelStatus">模型状态读取中</span><button class="button" id="historyOpen">历史对话</button></div></header>
<section class="overlay" id="historyOverlay" hidden><div class="drawer" role="dialog" aria-modal="true" aria-labelledby="historyTitle"><header class="drawer-head"><div><h2 id="historyTitle">历史对话</h2><p>记录保存在当前浏览器</p></div><button class="button" id="historyClose" aria-label="关闭">关闭</button></header><div class="history-list" id="historyList"></div><div class="history-empty" id="historyEmpty" hidden>还没有历史对话</div><footer class="drawer-foot"><button class="button" id="historyClear">清空历史</button></footer></div></section>
<main class="home" id="homeView"><section class="hero"><div class="avatar" aria-hidden="true">综</div><h1 id="greeting">你好，我是综智助手</h1><form class="home-form" id="homeForm"><textarea id="homeInput" rows="2" maxlength="4000" placeholder="综合管理部竭诚为您服务" aria-label="输入需求"></textarea><button class="send" id="homeSend" aria-label="发送">↑</button></form><p class="thinking" id="homeThinking" hidden>正在理解你的需求…</p></section><nav class="shortcut-grid" aria-label="业务助手"><button class="shortcut" data-assistant="meeting"><span class="shortcut-icon">▦</span><span><strong>会务助手</strong><small>安排会议、整理名单和会议材料</small></span><span class="arrow">↗</span></button><button class="shortcut" data-assistant="information"><span class="shortcut-icon">▤</span><span><strong>政务信息助手</strong><small>搜集要情、核对来源和整理专报</small></span><span class="arrow">↗</span></button><button class="shortcut" data-assistant="official_document"><span class="shortcut-icon">▧</span><span><strong>公文助手</strong><small>起草、润色和校对公文</small></span><span class="arrow">↗</span></button><button class="shortcut" data-assistant="knowledge"><span class="shortcut-icon">▤</span><span><strong>综合知识库</strong><small>查找制度、模板和历史案例</small></span><span class="arrow">↗</span></button></nav></main>
<section class="workspace" id="workspaceView" hidden><header class="workspace-head"><button class="back" id="backHome">← 首页</button><strong id="workspaceTitle">会务助手</strong><small id="workspaceSubtitle">智能体工作区</small></header><main class="layout"><aside class="chat"><div class="chat-head"><span class="chat-avatar">综</span><span><strong id="agentName">综智助手</strong><small>智能体 · 与你一起完成工作</small></span></div><div class="messages" id="messages" role="log" aria-live="polite"></div><form class="compose" id="chatForm"><textarea id="chatInput" rows="2" maxlength="4000" placeholder="继续补充背景、要求或修改意见…" aria-label="继续补充需求"></textarea><div class="compose-row"><small>Enter 发送 · Shift + Enter 换行</small><button class="button primary" id="chatSend">发送</button></div></form></aside><section class="result"><header class="result-head"><div><h2>工作成果</h2><p id="resultDescription">对话中的工作成果会显示在这里</p></div><span class="state" id="resultState">等待开始</span></header><div class="result-body"><div class="result-placeholder" id="resultPlaceholder"><div><b>准备好开始了</b><div>告诉我你的需求，成果将在这里整理呈现</div></div></div><div class="result-content" id="resultContent"></div><div class="result-attachment" id="resultRequest" hidden><strong>当前任务</strong><p id="resultRequestText"></p></div></div></section></main></section>
<script>
const $=id=>document.getElementById(id);const HISTORY_KEY='zongzhi.conversations.v1';
const assistants={meeting:{name:'会务助手',description:'安排会议、整理名单和会议材料',welcome:'我来协助你处理会务。请告诉我会议主题、时间、地点或参会人员。'},information:{name:'政务信息助手',description:'搜集要情、核对来源和整理专报',welcome:'我来协助你处理政务信息。请告诉我主题、时间范围、来源或材料用途。'},official_document:{name:'公文助手',description:'起草、润色和校对公文',welcome:'我来协助你处理公文。请告诉我文种、标题、收文对象或修改要求。'},knowledge:{name:'综合知识库',description:'查找制度、模板和历史案例',welcome:'我来帮你查找资料。请补充制度名称、关键词、时间或资料类型。'}};
let active=null,busy=false;
function readHistory(){try{return JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]')}catch(_){return []}}
function saveHistory(){if(!active||!active.messages.length)return;active.updatedAt=new Date().toISOString();const first=active.messages.find(m=>m.role==='user');if(first)active.title=first.text.slice(0,42);let items=readHistory().filter(x=>x.id!==active.id);items.unshift(active);try{localStorage.setItem(HISTORY_KEY,JSON.stringify(items.slice(0,100)))}catch(_){}}
function makeMessage(text,role='assistant',persist=true){const el=document.createElement('div');el.className='message '+role;el.textContent=text;$('messages').appendChild(el);$('messages').scrollTop=$('messages').scrollHeight;if(persist&&active){active.messages.push({role,text,at:new Date().toISOString()});saveHistory()}return el}
function startSession(intent,initial='',restore=null){const cfg=assistants[intent];if(!cfg)return;active=restore||{id:(crypto.randomUUID?.()||Date.now()+'-'+Math.random().toString(36).slice(2)),assistant:intent,title:'新对话',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),messages:[]};active.assistant=intent;$('messages').replaceChildren();$('homeView').hidden=true;$('workspaceView').hidden=false;$('workspaceTitle').textContent=cfg.name;$('agentName').textContent=cfg.name;$('workspaceSubtitle').textContent='智能体工作区 · '+cfg.description;$('resultDescription').textContent=cfg.description+' · 工作过程与成果展示';$('resultState').textContent='等待开始';$('resultState').classList.remove('ready');$('resultContent').textContent='';$('resultPlaceholder').hidden=false;
if(restore){for(const m of restore.messages||[])makeMessage(m.text,m.role,false);if(restore.messages?.length){$('resultPlaceholder').hidden=true;$('resultContent').textContent=restore.messages.filter(m=>m.role==='assistant').at(-1)?.text||''}}
else{if(initial)makeMessage(initial,'user');makeMessage(cfg.welcome,'assistant')}
const firstRequest=initial||(restore?.messages||[]).find(m=>m.role==='user')?.text||'';$('resultRequest').hidden=!firstRequest;$('resultRequestText').textContent=firstRequest;if(location.hash!=='#workbench/'+intent)history.pushState({workbench:intent},'', '#workbench/'+intent);setTimeout(()=>$('chatInput').focus(),50)}
function simpleIntent(text){if(/会务助手|政务信息助手|公文助手|综合知识库/u.test(text)){if(/政务信息助手/u.test(text))return'information';if(/公文助手/u.test(text))return'official_document';if(/综合知识库/u.test(text))return'knowledge';return'meeting'}if(/(查询|查找|查阅|搜一下|历史|以前|制度|模板|案例)/u.test(text)&&/(会议|会务|公文|信息|资料|要情|制度|模板|案例)/u.test(text))return'knowledge';if(/知识库/u.test(text))return'knowledge';if(/办会|办个会|开会|会议|会务|参会|会议室|会场/u.test(text))return'meeting';if(/要情|专报|新闻|信息稿|搜集.{0,4}信息/u.test(text))return'information';if(/公文|通知|请示|起草|润色|校对/u.test(text))return'official_document';return''}
async function classify(text){const direct=simpleIntent(text);if(direct)return direct;const r=await request('/api/ai/workbench-intent',{text});return r.intent||''}
async function request(url,data){const res=await fetch(url,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined});const body=await res.json().catch(()=>({}));if(!res.ok)throw new Error(body.error||'请求失败');return body}
$('homeForm').addEventListener('submit',async e=>{e.preventDefault();const text=$('homeInput').value.trim();if(!text||busy)return;busy=true;$('homeSend').disabled=true;$('homeThinking').textContent='正在理解你的需求…';$('homeThinking').hidden=false;try{const intent=await classify(text);if(!assistants[intent])throw new Error('暂时无法判断需求类型，请点击下方助手入口继续。');$('homeInput').value='';$('homeThinking').hidden=true;startSession(intent,text)}catch(err){$('homeThinking').textContent=err.message;$('homeThinking').hidden=false}finally{busy=false;$('homeSend').disabled=false}});
for(const button of document.querySelectorAll('[data-assistant]'))button.addEventListener('click',()=>startSession(button.dataset.assistant));
$('backHome').addEventListener('click',()=>{saveHistory();active=null;$('messages').replaceChildren();$('workspaceView').hidden=true;$('homeView').hidden=false;history.pushState({},'',location.pathname)});
$('chatForm').addEventListener('submit',async e=>{e.preventDefault();const text=$('chatInput').value.trim();if(!text||busy)return;busy=true;$('chatSend').disabled=true;$('chatInput').value='';makeMessage(text,'user');const pending=makeMessage('正在整理需求…','pending');$('resultPlaceholder').hidden=true;$('resultState').textContent='正在处理';$('resultState').classList.remove('ready');try{const out=await request('/api/ai/chat',{assistant:active.assistant,messages:active.messages.filter(m=>m.role==='user'||m.role==='assistant').slice(-20)});pending.remove();makeMessage(out.reply||'已完成。','assistant');$('resultContent').textContent=out.artifact||out.reply||'';$('resultState').textContent='已更新';$('resultState').classList.add('ready')}catch(err){pending.remove();makeMessage('处理失败：'+err.message,'assistant');$('resultState').textContent='处理失败'}finally{busy=false;$('chatSend').disabled=false;$('chatInput').focus()}});
$('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('chatForm').requestSubmit()}});
function renderHistory(){const list=$('historyList');list.replaceChildren();const items=readHistory().sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));$('historyEmpty').hidden=!!items.length;$('historyClear').disabled=!items.length;for(const item of items){const row=document.createElement('article');row.className='history-row';const open=document.createElement('button');open.className='history-open';open.type='button';const title=document.createElement('span');title.className='history-title';title.textContent=item.title||'新对话';const meta=document.createElement('span');meta.className='history-meta';meta.textContent=(assistants[item.assistant]?.name||'综智助手')+' · '+new Intl.DateTimeFormat('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(item.updatedAt));open.append(title,meta);open.onclick=()=>{saveHistory();$('historyOverlay').hidden=true;startSession(item.assistant,'',item)};const del=document.createElement('button');del.className='button';del.type='button';del.textContent='删除';del.onclick=()=>{if(active?.id===item.id)active=null;localStorage.setItem(HISTORY_KEY,JSON.stringify(readHistory().filter(x=>x.id!==item.id)));renderHistory()};row.append(open,del);list.append(row)}}
$('historyOpen').onclick=()=>{renderHistory();$('historyOverlay').hidden=false};$('historyClose').onclick=()=>$('historyOverlay').hidden=true;$('historyOverlay').onclick=e=>{if(e.target===$('historyOverlay'))$('historyOverlay').hidden=true};$('historyClear').onclick=()=>{active=null;localStorage.removeItem(HISTORY_KEY);renderHistory()};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('historyOverlay').hidden=true});
window.addEventListener('popstate',()=>{if(location.hash.startsWith('#workbench/')){const key=location.hash.split('/')[1];startSession(assistants[key]?key:'meeting')}else{$('workspaceView').hidden=true;$('homeView').hidden=false;active=null;$('messages').replaceChildren()}});
(async()=>{try{const s=await request('/api/ai/status');$('modelStatus').textContent=s.configured?'模型已连接 · '+s.model:'模型未配置'}catch(_){$('modelStatus').textContent='模型服务未连接'}if(location.hash.startsWith('#workbench/')){const key=location.hash.split('/')[1];if(assistants[key])startSession(key)}})();
</script>
</body>
</html>
