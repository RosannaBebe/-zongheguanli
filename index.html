<!doctype html>
<html lang="zh-CN">
<head>

<title>综智助手</title>
<style>
:root{--ink:#10243a;--text:#263e58;--muted:#4d637b;--line:#c3d2e3;--blue:#174f9c;--blue-dark:#103b78;--soft:#e1ecf9;--paper:#fff;--warm:#b87521;--warm-soft:#f7ead6;--font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:var(--font);color:var(--ink);background:#eef3f9}button,textarea{font:inherit}button{cursor:pointer} [hidden]{display:none!important}.only-local,#loginStatus{display:none!important}
body{min-height:100vh;background:radial-gradient(ellipse at 84% 12%,#b9e0f1 0,transparent 48%),radial-gradient(ellipse at 14% 36%,#cbcef0 0,transparent 49%),radial-gradient(ellipse at 54% 100%,#f2e4d2 0,transparent 37%),#eef3f9}
.topbar{height:72px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:#f7f9fd;border-bottom:1px solid #c4d2e1}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none;font-size:16px;font-weight:700}.brand-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:var(--blue);color:white;font-size:18px;box-shadow:inset 0 -3px 0 #d49a42}
.top-actions{display:flex;align-items:center;gap:10px}.top-actions span{font-size:12px;color:var(--muted)}.button{border:1px solid #b7c9dd;border-radius:10px;background:#fff;color:var(--text);padding:8px 12px;font-size:12px}.button:hover{background:#eaf0f7}.button.primary{background:var(--blue);border-color:var(--blue);color:#fff}.button.primary:hover{background:var(--blue-dark)}
.home{width:min(900px,100%);margin:0 auto;padding:54px 24px 42px}.hero{text-align:center}.avatar{display:block;width:100px;height:100px;margin:0 auto 18px;border-radius:50%;object-fit:cover;background:#e1edfc;box-shadow:0 10px 25px #32598c18}.hero h1{margin:0 0 26px;font-size:clamp(28px,5vw,46px);line-height:1.2;letter-spacing:-.04em}.home-form{display:flex;gap:12px;align-items:flex-end;padding:12px 13px 12px 20px;border:1px solid #9eb8d5;border-radius:17px;background:#fff;box-shadow:0 12px 34px #315a8e15}.home-form:focus-within{border-color:#3c73b3;box-shadow:0 0 0 3px #b7d0ee80,0 12px 34px #315a8e15}.home-form textarea{flex:1;min-width:0;min-height:48px;max-height:180px;resize:vertical;border:0;outline:0;padding:7px 0;background:transparent;color:var(--ink);line-height:1.6}.home-form textarea::placeholder{color:#4d647d}.send{width:44px;height:44px;border:0;border-radius:11px;background:var(--blue);color:#fff;font-size:20px}.send:disabled{opacity:.6}.thinking{margin:12px 4px;color:var(--muted);font-size:13px}
.shortcut-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:24px}.shortcut{display:flex;align-items:center;gap:9px;min-height:76px;padding:10px 11px;text-align:left;border:1px solid var(--line);border-radius:14px;background:#ffffffdf;color:var(--ink);transition:.15s;text-decoration:none}.shortcut:hover{background:#fff;border-color:#9bbce4;transform:translateY(-1px)}.shortcut-icon{display:grid;place-items:center;width:32px;height:32px;flex:none;border-radius:11px;background:#dce8f6;color:#174f9c;font-size:18px}.shortcut strong{display:block;font-size:13px}.shortcut small{display:block;margin-top:4px;color:var(--muted);font-size:11px;line-height:1.4}.arrow{margin-left:auto;color:#587896}
.workspace{min-height:calc(100vh - 72px)}.workspace-head{display:flex;align-items:center;gap:14px;padding:16px clamp(16px,3vw,36px);background:#ffffffed;border-bottom:1px solid var(--line)}.back{border:0;background:transparent;color:#47627d;font-weight:600;padding:8px}.workspace-head strong{font-size:17px}.workspace-head small{margin-left:auto;color:var(--muted);font-size:12px}
.layout{display:grid;grid-template-columns:230px minmax(300px,390px) minmax(0,1fr);gap:16px;max-width:1580px;min-height:calc(100vh - 140px);margin:0 auto;padding:18px clamp(16px,3vw,36px) 30px}.agent-history,.chat,.result{min-width:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;background:#ffffffed;box-shadow:0 10px 30px #315a8e0d;overflow:hidden}.agent-history{min-height:620px;max-height:calc(100vh - 160px)}.agent-history-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:15px 13px;border-bottom:1px solid #ccd9e7}.agent-history-head strong{font-size:13px}.agent-history-list{flex:1;overflow:auto;padding:10px;display:grid;align-content:start;gap:8px}.agent-history-item{width:100%;padding:10px;text-align:left;border:1px solid transparent;border-radius:11px;background:transparent;color:var(--ink)}.agent-history-item:hover,.agent-history-item.active{border-color:#b9cce2;background:#e1ebf7}.agent-history-item strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.agent-history-item small{display:block;margin-top:5px;color:var(--muted);font-size:10px}.agent-history-empty{padding:18px 11px;color:var(--muted);font-size:11px;line-height:1.6}.chat,.result{min-height:620px;max-height:calc(100vh - 160px)}.chat-head{display:flex;align-items:center;gap:11px;padding:16px 18px;border-bottom:1px solid #ccd9e7}.chat-avatar{display:block;width:46px;height:46px;flex:none;object-fit:cover;border-radius:14px;background:#e5effb;box-shadow:0 5px 14px #235fbf20}.chat-head strong{font-size:14px}.chat-head small{display:block;margin-top:3px;color:#526981;font-size:11px}.messages{flex:1;display:flex;flex-direction:column;gap:12px;padding:18px;overflow:auto}.message{max-width:95%;width:fit-content;padding:11px 13px;border:1px solid #ccd9e7;border-radius:15px;background:#eef3f9;color:#293e54;font-size:13px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}.message.user{align-self:flex-end;background:#dce9f9;border-color:#b8cce4;border-bottom-right-radius:5px}.message.assistant{border-bottom-left-radius:5px}.message.pending{color:#526981}.compose{padding:13px;border-top:1px solid #ccd9e7}.compose textarea{display:block;width:100%;min-height:76px;max-height:180px;resize:vertical;padding:10px 12px;border:1px solid #b7c9dd;border-radius:12px;outline:0;font-size:13px;line-height:1.6}.compose textarea:focus{border-color:#78a3df;box-shadow:0 0 0 3px #b7d0ee80}.compose-row{display:flex;align-items:center;justify-content:space-between;margin-top:9px;gap:10px}.compose-row small{color:#536981;font-size:11px}.result-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:20px 22px 15px;border-bottom:1px solid #ccd9e7;background:#fff}.result-head h2{margin:0;font-size:17px}.result-head p{margin:5px 0 0;color:#526981;font-size:12px}.state{font-size:11px;color:#52708e}.state:before{content:"";display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:50%;background:#55799f}.state.ready:before{background:#36a477}.result-body{flex:1;overflow:auto;padding:22px;background:linear-gradient(#fff,#f6f9fd)}.result-placeholder{height:100%;min-height:390px;display:grid;place-content:center;text-align:center;color:var(--muted)}.result-placeholder b{margin-bottom:8px;color:var(--text);font-size:17px}.result-content{font-size:14px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.result-content:empty{display:none}.result-attachment{margin-top:18px;padding:13px;border:1px solid var(--line);border-radius:12px;background:white}.result-attachment strong{font-size:12px}.result-attachment p{margin:5px 0 0;color:var(--text);font-size:13px;white-space:pre-wrap}
.overlay{position:fixed;inset:0;z-index:20;display:flex;justify-content:flex-end;background:#14263855;backdrop-filter:blur(3px)}.drawer{width:min(440px,100vw);height:100%;display:flex;flex-direction:column;padding:22px;background:#eef3f9;box-shadow:-15px 0 45px #14263820}.drawer-head{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:16px;border-bottom:1px solid var(--line)}.drawer-head h2{margin:0;font-size:19px}.drawer-head p{margin:5px 0 0;color:var(--muted);font-size:12px}.history-list{flex:1;overflow:auto;display:grid;align-content:start;gap:9px;padding:15px 0}.history-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:13px;border:1px solid var(--line);border-radius:13px;background:white}.history-open{min-width:0;border:0;background:transparent;text-align:left;color:var(--ink);cursor:pointer}.history-title{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:650}.history-meta{display:block;margin-top:5px;color:#526981;font-size:11px}.history-empty{padding:40px 10px;text-align:center;color:var(--muted);font-size:13px}.drawer-foot{padding-top:13px;border-top:1px solid var(--line)}
@media(max-width:900px){.shortcut-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:1100px){.layout{grid-template-columns:210px minmax(280px,360px) minmax(0,1fr);gap:12px;padding-inline:16px}}
@media(max-width:850px){.layout{grid-template-columns:1fr;padding:12px;min-height:0}.agent-history{min-height:0;max-height:none}.agent-history-list{display:flex;gap:6px;overflow:auto}.agent-history-item{flex:0 0 180px}.chat{min-height:470px;max-height:68vh}.result{min-height:420px;max-height:none}}
@media(max-width:760px){.topbar{height:60px;padding:0 15px}.top-actions span{display:none}.home{padding:38px 15px}.shortcut-grid{gap:8px}.shortcut{padding:10px;gap:8px}.shortcut strong{font-size:13px}.shortcut small{font-size:11px}.workspace-head{padding:12px 14px}}
</style>
</head>
<body>
<header class="topbar" id="topbar"><a class="brand" href="/"><span class="brand-mark">综</span>综智助手</a><div class="top-actions"><span id="modelStatus">模型状态读取中</span><button class="button" id="historyOpen">历史对话</button></div></header>
<section class="overlay" id="historyOverlay" hidden><div class="drawer" role="dialog" aria-modal="true" aria-labelledby="historyTitle"><header class="drawer-head"><div><h2 id="historyTitle">历史对话</h2><p>记录保存在当前浏览器</p></div><button class="button" id="historyClose" aria-label="关闭">关闭</button></header><div class="history-list" id="historyList"></div><div class="history-empty" id="historyEmpty" hidden>还没有历史对话</div><footer class="drawer-foot"><button class="button" id="historyClear">清空历史</button></footer></div></section>
<main class="home" id="homeView"><section class="hero"><img class="avatar" id="homeAvatar" alt="综智助手形象"><h1 id="greeting">您好，我是综智助手</h1><form class="home-form" id="homeForm"><textarea id="homeInput" rows="2" maxlength="4000" placeholder="工程设计院综合管理部竭诚为您服务" aria-label="请告知您需要办理的事项"></textarea><button class="send" id="homeSend" aria-label="发送需求">↑</button></form><p class="thinking" id="homeThinking" hidden>正在为您梳理需求，请稍候…</p></section><nav class="shortcut-grid" aria-label="业务助手"><button class="shortcut" data-assistant="meeting"><span class="shortcut-icon">▦</span><span><strong>会务助手</strong><small>会议安排、名单和材料，我来替您统筹</small></span><span class="arrow">↗</span></button><button class="shortcut" data-assistant="information"><span class="shortcut-icon">▤</span><span><strong>政务信息助手</strong><small>为您搜集要情、核验来源并整理专报</small></span><span class="arrow">↗</span></button><button class="shortcut" data-assistant="official_document"><span class="shortcut-icon">▧</span><span><strong>公文助手</strong><small>为您起草、润色并校核公文</small></span><span class="arrow">↗</span></button><button class="shortcut" data-assistant="knowledge"><span class="shortcut-icon">▤</span><span><strong>综合知识库</strong><small>为您查阅制度、模板和历史案例</small></span><span class="arrow">↗</span></button></nav></main>
<section class="workspace" id="workspaceView" hidden><header class="workspace-head"><button class="back" id="backHome">← 返回首页</button><strong id="workspaceTitle">会务助手</strong><small id="workspaceSubtitle">我会为您周到安排</small></header><main class="layout"><aside class="agent-history"><header class="agent-history-head"><strong id="agentHistoryTitle">会议列表</strong><button class="button" id="newConversation">＋ 新建会议</button></header><div class="agent-history-list" id="agentHistoryList"></div><div class="agent-history-empty" id="agentHistoryEmpty">还没有会议记录。新建后，每次会议会作为独立记录保存在这里。</div></aside><aside class="chat"><div class="chat-head"><img class="chat-avatar" id="chatAvatar" alt=""><span><strong id="agentName">小会</strong><small id="agentTagline">您好，会议安排我来替您细细统筹。</small></span></div><div class="messages" id="messages" role="log" aria-live="polite"></div><form class="compose" id="chatForm"><textarea id="chatInput" rows="2" maxlength="4000" placeholder="请补充背景、具体要求或修改意见…" aria-label="请补充您的需求"></textarea><div class="compose-row"><small>Enter 发送 · Shift + Enter 换行</small><button class="button primary" id="chatSend">发送</button></div></form></aside><section class="result"><header class="result-head"><div><h2>工作成果</h2><p id="resultDescription">对话中的工作成果会显示在这里</p></div><span class="state" id="resultState">等待开始</span></header><div class="result-body"><div class="result-placeholder" id="resultPlaceholder"><div><b>已为您准备就绪</b><div>请说明您的需求，工作成果将在此处整理呈现</div></div></div><div class="result-content" id="resultContent"></div><div class="result-attachment" id="resultRequest" hidden><strong>当前办理事项</strong><p id="resultRequestText"></p></div></div></section></main></section>

const assistants={mefunction makePortrait({skin,hair,style,glasses=false}){const side=style==='pony'?'<path d="M32 48Q18 60 27 82Q32 77 34 65M88 48Q103 59 94 81Q88 76 87 64" fill="#'+hair+'"/>':style==='bob'?'<path d="M31 45Q23 69 31 82L39 69 39 47M89 45Q97 68 90 82L82 68 82 47" fill="#'+hair+'"/>':style==='silver'?'<path d="M34 43Q44 23 61 30Q77 23 87 42L84 50Q78 39 68 40Q50 45 36 53Z" fill="#'+hair+'"/>':'<path d="M34 48Q35 33 60 32Q83 33 87 49L83 56Q64 44 38 56Z" fill="#'+hair+'"/>';const frames=glasses?'<g fill="none" stroke="#344452" stroke-width="2.2"><rect x="39" y="53" width="18" height="12" rx="5"/><rect x="63" y="53" width="18" height="12" rx="5"/><path d="M57 58h6M39 57l-4-1M81 57l4-1"/></g>':'';return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f4f8fd"/><stop offset="1" stop-color="#dceafa"/></linearGradient><linearGradient id="shirt" x2="0" y2="1"><stop stop-color="#aeb9c4"/><stop offset="1" stop-color="#8795a2"/></linearGradient></defs><circle cx="60" cy="60" r="60" fill="url(#bg)"/><path d="M17 120Q20 88 43 82h34q23 6 26 38" fill="url(#shirt)"/><path d="M44 80l16 13 16-13 10 8-12 13H46L34 88Z" fill="#e4e9ee"/><path d="M53 88h14l-3 8-4 3-5-3Z" fill="#4b78ad"/><rect x="53" y="71" width="14" height="17" rx="6" fill="#d9a889"/>${side}<ellipse cx="60" cy="58" rx="27" ry="31" fill="#${skin}"/><path d="M33 57Q32 38 43 35l4 10v13M87 57Q88 38 77 35l-4 10v13" fill="#${hair}"/><ellipse cx="49" cy="59" rx="2" ry="2.6" fill="#263748"/><ellipse cx="71" cy="59" rx="2" ry="2.6" fill="#263748"/>${frames}<path d="M56 71q4 3 8 0" fill="none" stroke="#a96f66" stroke-width="1.8" stroke-linecap="round"/><path d="M27 39Q30 16 60 17q30-1 33 22v7H27Z" fill="#fff" stroke="#c4ccd5" stroke-width="2"/><path d="M23 44q37 8 74 0v6q-37 9-74 0Z" fill="#f8fafc" stroke="#c4ccd5" stroke-width="2"/><path d="M53 30h14l-3 3h-8Z" fill="#2765b8"/><path d="M59 29l-2 5M64 29l-2 5" stroke="#e69a36" stroke-width="1.5"/></svg>`}
const portraits={home:makePortrait({skin:'e7bd9f',hair:'303a45',style:'bob',glasses:true}),meeting:makePortrait({skin:'edc5a9',hair:'303a45',style:'bob',glasses:true}),information:makePortrait({skin:'d5a17f',hair:'30363b',style:'short',glasses:false}),official_document:makePortrait({skin:'f0cbb1',hair:'453b38',style:'pony',glasses:true}),knowledge:makePortrait({skin:'ddb394',hair:'8a9298',style:'silver',glasses:true})};
const assistants={meeting:{name:'会务助手',person:'小会',tagline:'您好，会议安排我来替您细细统筹。',portrait:portraits.meeting,listTitle:'会议列表',description:'围绕每一次会议持续整理需求、材料和变更',welcome:'您好，我是小会。会议筹备的事，我会替您细致统筹。我们先确认这场会议的名称或主题，好吗？如果此前已经沟通过，我也会帮您接续原来的安排。'},information:{name:'政务信息助手',person:'小闻',tagline:'您好，重要信息我会为您认真核实、清楚梳理。',portrait:portraits.information,listTitle:'政务信息记录',description:'梳理政务要情、核验信息来源并整理专报',welcome:'您好，我是小闻。您把关注主题和时间范围告诉我，我会逐项核实来源，再为您整理成清晰可靠的要情材料。'},official_document:{name:'公文助手',person:'小文',tagline:'您好，文稿的起草与校核，我会为您仔细把关。',portrait:portraits.official_document,listTitle:'公文记录',description:'起草、润色和校核公文',welcome:'您好，我是小文。请您告诉我文稿用途、对象和主要要求，我会认真起草或校核，并把需要您确认的内容标清楚。'},knowledge:{name:'综合知识库',person:'小知',tagline:'您好，需要查阅的资料，我来为您细心找齐。',portrait:portraits.knowledge,listTitle:'知识查询记录',description:'为您查阅制度、模板和历史案例',welcome:'您好，我是小知。您想查哪项制度、模板或过往案例？我会依据现有资料为您查找整理，材料不足的地方也会如实说明。'}};
$('homeAvatar').src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(portraits.home);y=false,pendingMeetingRequest='';
function readHistory(){try{return JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]')}catch(_){return []}}
function saveHistory(){if(!active||!active.messages.length)return;active.updatedAt=new Date().toISOString();const first=active.messages.find(m=>m.role==='user');if(first)active.title=active.assistant==='meeting'?(active.meetingName||first.text.slice(0,42)):first.text.slice(0,42);let items=readHistory().filter(x=>x.id!==active.id);items.unshift(active);try{localStorage.setItem(HISTORY_KEY,JSON.stringify(items.slice(0,200)))}catch(_){}renderAgentHistory()}

function startSession(intent,initial='',restore=null,options={}){const cfg=assistants[intent];if(!cfg)return;active=restore||{id:(crypto.randomUUID?.()||Date.now()+'-'+Math.random().toString(36).slice(2)),assistant:intent,title:'新对话',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),messages:[],meetingName:'',meetingFacts:{}};active.assistant=intent;active.meetingFacts=active.meetingFacts||{};$('messages').replaceChildren();$('homeView').hidden=true;$('workspaceView').hidden=false;$('topbar').hidden=true;$('workspaceTitle').textContent=cfg.name;$('agentName').textContent=cfg.person;$('chatAvatar').src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(cfg.portrait);$('chatAvatar').alt=cfg.person+'的形象';$('agentTagline').textContent=cfg.tagline;$('workspaceSubtitle').textContent=intent==='meeting'&&active.meetingName?'当前会议 · '+active.meetingName:cfg.tagline;$('resultDescription').textContent=cfg.description+' · 工作过程与成果展示';$('resultState').textContent='等待开始';$('resultState').classList.remove('ready');$('resultContent').textContent='';$('resultPlaceholder').hidden=false;renderAgentHistory();
if(restore){for(const m of restore.messages||[])makeMessage(m.text,m.role,false);if(restore.messages?.length){$('resultPlaceholder').hidden=true;$('resultContent').textContent=restore.messages.filter(m=>m.role==='assistant').at(-1)?.text||''}}
else if(!options.silent){makeMessage(cfg.welcome,'assistant',false)}
const firstRequest=initial||(restore?.messages||[]).find(m=>m.role==='user')?.text||'';$('resultRequest').hidden=!firstRequest;$('resultRequestText').textContent=firstRequest;if(location.hash!=='#workbench/'+intent)history.pushState({workbench:intent},'', '#workbench/'+intent);setTimeout(()=>$('chatInput').focus(),50)}
function simpleIntent(text){if(/会务助手|政务信息助手|公文助手|综合知识库/u.test(text)){if(/政务信息助手/u.test(text))return'information';if(/公文助手/u.test(text))return'official_document';if(/综合知识库/u.test(text))return'knowledge';return'meeting'}if(/(之前|上次|刚才|原来|那场|这场|继续|接着|讨论过|已经聊过).{0,12}(会议|会务|参会|人数|材料)|(会议|会务).{0,10}(改成|调整|更新|继续|接着|之前|上次)/u.test(text))return'meeting';if(/(查询|查找|查阅|搜一下|历史|以前|制度|模板|案例)/u.test(text)&&/(会议制度|会务制度|会议模板|会议案例|公文|信息|资料|要情|制度|模板|案例)/u.test(text))return'knowledge';if(/知识库/u.test(text))return'knowledge';if(/办会|办个会|开会|会议|会务|参会|会议室|会场/u.test(text))return'meeting';if(/要情|专报|新闻|信息稿|搜集.{0,4}信息/u.test(text))return'information';if(/公文|通知|请示|起草|润色|校对/u.test(text))return'official_document';return''}
async function classify(text){const direct=simpleIntent(text);if(direct)return direct;const r=await request('/api/ai/workbench-intent',{text});return r.intent||''}
async function request(url,data){const res=await fetch(url,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined});const body=await res.json().catch(()=>({}));if(!res.ok)throw new Error(body.error||'请求失败');return body}
async function findPreviousMeeting(text){const items=readHistory().filter(x=>x.assistant==='meeting');if(!items.length)return null;const meetings=items.slice(0,40).map(x=>({id:x.id,name:x.meetingName||'',title:x.title||'',facts:x.meetingFacts||{},messages:(x.messages||[]).filter(m=>m.role==='user').slice(-8).map(m=>m.text.slice(0,300))}));let clarify=false;try{const result=await request('/api/meeting/match',{text,meetings});if(result.match_id){const found=items.find(x=>x.id===result.match_id);if(found)return{conversation:found}}clarify=!!result.clarify}catch(_){}const normalized=text.replace(/[\s，。！？、：:；;“”"'（）()]/g,'').toLowerCase();const exact=items.find(x=>{const name=(x.meetingName||'').replace(/[\s，。！？、：:；;“”"'（）()]/g,'').toLowerCase();return name.length>1&&normalized.includes(name)});if(exact)return{conversation:exact};return clarify?{clarify:true}:null}
async function sendToAgent(text,options={}){if(!active||busy)return;if(text&&active.assistant==='meeting'&&!options.skipMatch&&!active.messages.some(m=>m.role==='user')){busy=true;const previous=await findPreviousMeeting(text);busy=false;if(previous?.conversation){startSession('meeting','',previous.conversation);return sendToAgent(text)}if(previous?.clarify){pendingMeetingRequest=text;makeMessage('为避免重复建立会议记录，我查到几条可能相关的会议。请您从左侧列表选择要继续办理的会议；如为新会议，请点击“＋ 新建会议”，我会沿用您刚才提供的需求。','assistant',false);$('resultRequest').hidden=false;$('resultRequestText').textContent=text;return}}busy=true;$('chatSend').disabled=true;if(text){makeMessage(text,'user');$('resultRequest').hidden=false;$('resultRequestText').textContent=text}const pending=makeMessage('正在结合本次记录为您整理，请稍候…','pending');$('resultPlaceholder').hidden=true;$('resultState').textContent='正在处理';$('resultState').classList.remove('ready');try{const messages=active.messages.filter(m=>m.role==='user'||m.role==='assistant').slice(-30);const out=await request('/api/ai/chat',{assistant:active.assistant,messages,meeting_memory:active.assistant==='meeting'?{name:active.meetingName||'',facts:active.meetingFacts||{}}:null});pending.remove();if(active.assistant==='meeting'&&out.meeting){if(out.meeting.name)active.meetingName=out.meeting.name;active.meetingFacts={...(active.meetingFacts||{}),...(out.meeting.facts||{})};if(active.meetingName){active.title=active.meetingName;$('workspaceSubtitle').textContent='当前会议 · '+active.meetingName}}makeMessage(out.reply||'已完成。','assistant');$('resultContent').textContent=out.artifact||out.reply||'';$('resultState').textContent='已更新';$('resultState').classList.add('ready');saveHistory()}catch(err){pending.remove();makeMessage('暂时未能完成：'+err.message,'assistant');$('resultState').textContent='处理失败'}finally{busy=false;$('chatSend').disabled=false;$('chatInput').focus()}}
$('homeForm').addEventListener('submit',async e=>{e.preventDefault();const text=$('homeInput').value.trim();if(!text||busy)return;busy=true;$('homeSend').disabled=true;$('homeThinking').textContent='正在为您梳理需求…';$('homeThinking').hidden=false;try{const intent=await classify(text);if(!assistants[intent])throw new Error('抱歉，暂未能准确判断您的需求。请从下方选择相应助手，我将继续为您办理。');$('homeInput').value='';$('homeThinking').hidden=true;if(intent==='meeting'){const previous=await findPreviousMeeting(text);if(previous?.conversation){busy=false;startSession('meeting','',previous.conversation);await sendToAgent(text,{skipMatch:true});return}if(previous?.clarify){pendingMeetingRequest=text;startSession('meeting','',null,{silent:true});makeMessage('为避免重复建立会议记录，我查到几条可能相关的会议。请您从左侧列表选择要继续办理的会议；如为新会议，请点击“＋ 新建会议”，我会沿用您刚才提供的需求。','assistant',false);$('resultRequest').hidden=false;$('resultRequestText').textContent=text;return}}busy=false;startSession(intent,'',null,{silent:true});await sendToAgent(text,{skipMatch:true})}catch(err){$('homeThinking').textContent=err.message;$('homeThinking').hidden=false}finally{busy=false;$('homeSend').disabled=false}});
for(const button of document.querySelectorAll('[data-assistant]'))button.addEventListener('click',()=>startSession(button.dataset.assistant));
$('newConversation').addEventListener('click',()=>{const pending=pendingMeetingRequest;pendingMeetingRequest='';startSession(active?.assistant||'meeting','',null,{silent:!!pending});if(pending)sendToAgent(pending,{skipMatch:true})});
$('backHome').addEventListener('click',()=>{saveHistory();active=null;$('messages').replaceChildren();$('workspaceView').hidden=true;$('homeView').hidden=false;$('topbar').hidden=false;history.pushState({},'',location.pathname)});
$('chatForm').addEventListener('submit',e=>{e.preventDefault();const text=$('chatInput').value.trim();if(!text||busy)return;$('chatInput').value='';sendToAgent(text)});
$('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('chatForm').requestSubmit()}});
function renderHistory(){const list=$('historyList');list.replaceChildren();const items=readHistory().sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));$('historyEmpty').hidden=!!items.length;$('historyClear').disabled=!items.length;for(const item of items){const row=document.createElement('article');row.className='history-row';const open=document.createElement('button');open.className='history-open';open.type='button';const title=document.createElement('span');title.className='history-title';title.textContent=item.title||'新对话';const meta=document.createElement('span');meta.className='history-meta';meta.textContent=(assistants[item.assistant]?.name||'综智助手')+' · '+new Intl.DateTimeFormat('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(item.updatedAt));open.append(title,meta);open.onclick=()=>{saveHistory();$('historyOverlay').hidden=true;startSession(item.assistant,'',item)};const del=document.createElement('button');del.className='button';del.type='button';del.textContent='删除';del.onclick=()=>{if(active?.id===item.id)active=null;localStorage.setItem(HISTORY_KEY,JSON.stringify(readHistory().filter(x=>x.id!==item.id)));renderHistory()};row.append(open,del);list.append(row)}}
$('historyOpen').onclick=()=>{renderHistory();$('historyOverlay').hidden=false};$('historyClose').onclick=()=>$('historyOverlay').hidden=true;$('historyOverlay').onclick=e=>{if(e.target===$('historyOverlay'))$('historyOverlay').hidden=true};$('historyClear').onclick=()=>{active=null;localStorage.removeItem(HISTORY_KEY);renderHistory()};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('historyOverlay').hidden=true});
window.addEventListener('popstate',()=>{if(location.hash.startsWith('#workbench/')){const key=location.hash.split('/')[1];startSession(assistants[key]?key:'meeting')}else{$('workspaceView').hidden=true;$('homeView').hidden=false;$('topbar').hidden=false;active=null;$('messages').replaceChildren()}});
(async()=>{try{const s=await request('/api/ai/status');$('modelStatus').textContent=s.configured?'模型已连接 · '+s.model:'模型未配置'}catch(_){$('modelStatus').textContent='模型服务未连接'}if(location.hash.startsWith('#workbench/')){const key=location.hash.split('/')[1];if(assistants[key])startSession(key)}})();
</script>
